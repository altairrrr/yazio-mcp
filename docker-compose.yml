services:
  yazio-mcp:
    image: node:20-alpine
    container_name: yazio-mcp
    restart: unless-stopped
    working_dir: /app
    command: node_modules/.bin/tsx src/index.ts
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_PORT=8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "3841:8000"
    labels:
      net.unraid.docker.icon: "https://www.yazio.com/favicon.ico"
